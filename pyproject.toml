[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-intelligence"
version = "0.1.0"
description = "Convert meeting recordings into canonical structured meeting records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["google-api-python-client>=2.190,<3", "google-auth>=2.48,<3", "openai>=2.53,<3", "pydantic>=2.7,<3", "pydantic-settings>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
meeting-process = "meeting_intelligence.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls a paid external API and runs only when explicitly selected with -m live",
]
